<!doctype html>
<!-- Single page for the whole app: the room (also the draft page you land on before a session exists) and the
     ended-session screen. Scripts and styles are
     external files only (no inline code), and all visible text comes from data-i18n attributes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>PastePage</title>
<script src="theme.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="vendor/highlight.min.js" defer></script>
<script src="js/app.js" type="module"></script>
</head>
<body>

<main id="view-gone" class="screen" hidden>
  <div class="wrap narrow">
    <p class="brand">Paste<span>Page</span></p>
    <h1 data-i18n="gone.title"></h1>
    <p class="lede" data-i18n="gone.lede"></p>
    <p><button type="button" class="primary" id="gone-new" data-i18n="gone.home"></button></p>
    <footer class="site-foot">
      <div class="theme-switch" role="group" data-i18n-aria="settings.theme">
        <button type="button" data-theme-choice="system" data-i18n="settings.system"></button>
        <button type="button" data-theme-choice="light" data-i18n="settings.light"></button>
        <button type="button" data-theme-choice="dark" data-i18n="settings.dark"></button>
      </div>
      <select class="lang-select" data-i18n-aria="settings.language"></select>
      <a class="credit" href="https://sidebit.io" target="_blank" rel="noopener" data-i18n="credit"></a>
    </footer>
  </div>
</main>

<div id="view-room" class="room" hidden>
  <header class="top">
    <div class="wrap top-row">
      <p class="brand small">Paste<span>Page</span></p>
      <span class="pill live" id="present" data-i18n-title="room.hereTitle"></span>
      <div class="spacer"></div>
      <div class="menu-wrap" id="join-wrap" hidden>
        <button type="button" class="ghost" id="join-btn" aria-haspopup="true" aria-expanded="false" aria-controls="join-menu" data-i18n="join.button"></button>
        <form class="menu join" id="join-menu" autocomplete="off" hidden>
          <p class="menu-label" data-i18n="join.title"></p>
          <p class="hint" data-i18n="join.hint"></p>
          <label for="join-id" data-i18n="join.id"></label>
          <input id="join-id" type="text" required spellcheck="false" autocapitalize="off" autocorrect="off" data-i18n-placeholder="join.idPlaceholder">
          <label for="join-pass" data-i18n="join.pass"></label>
          <input id="join-pass" type="text" required spellcheck="false" autocapitalize="off" autocorrect="off">
          <button class="primary block" type="submit" id="join-go" data-i18n="join.go"></button>
          <p class="error" id="join-err" role="alert" hidden></p>
        </form>
      </div>
      <div class="menu-wrap">
        <button type="button" class="ghost" id="invite-btn" aria-haspopup="true" aria-expanded="false" aria-controls="invite-menu" data-i18n="invite.button"></button>
        <div class="menu invite" id="invite-menu" hidden>
          <p class="menu-label" data-i18n="invite.label"></p>
          <div class="kv" id="inv-row-linkPass"><span data-i18n="invite.linkPass"></span><code id="inv-linkPass"></code><button type="button" data-copy="linkPass" data-i18n="invite.copy"></button></div>
          <div class="kv"><span data-i18n="invite.link"></span><code id="inv-link"></code><button type="button" data-copy="link" data-i18n="invite.copy"></button></div>
          <div class="kv"><span data-i18n="invite.id"></span><code id="inv-id"></code><button type="button" data-copy="id" data-i18n="invite.copy"></button></div>
          <div class="kv"><span data-i18n="invite.pass"></span><code id="inv-pass"></code><button type="button" data-copy="pass" id="inv-copy-pass" data-i18n="invite.copy"></button></div>
          <button type="button" class="primary block" data-copy="invite" id="inv-copy-invite" data-i18n="invite.copyInvite"></button>
          <p class="hint" data-i18n="invite.hint"></p>
        </div>
      </div>
      <div class="menu-wrap">
        <button type="button" class="pill expiry" id="expiry-btn" aria-haspopup="true" aria-expanded="false" aria-controls="expiry-menu" data-i18n-title="expiry.title"></button>
        <div class="menu" id="expiry-menu" hidden>
          <p class="menu-label" data-i18n="expiry.label"></p>
          <div class="menu-opts" id="expiry-opts"></div>
          <div id="expiry-danger">
            <hr>
            <button type="button" class="danger-text" id="clear-btn" data-i18n="expiry.clear"></button>
            <button type="button" class="danger-text" id="end-btn" data-i18n="expiry.end"></button>
          </div>
        </div>
      </div>
      <div class="menu-wrap">
        <button type="button" class="ghost icon" id="settings-btn" aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu" data-i18n-aria="settings.button" data-i18n-title="settings.button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
        </button>
        <div class="menu settings" id="settings-menu" hidden>
          <p class="menu-label" data-i18n="settings.theme"></p>
          <div class="theme-switch" role="group" data-i18n-aria="settings.theme">
            <button type="button" data-theme-choice="system" data-i18n="settings.system"></button>
            <button type="button" data-theme-choice="light" data-i18n="settings.light"></button>
            <button type="button" data-theme-choice="dark" data-i18n="settings.dark"></button>
          </div>
          <p class="menu-label" data-i18n="settings.width"></p>
          <div class="theme-switch" role="group" data-i18n-aria="settings.width">
            <button type="button" data-width-choice="normal" data-i18n="settings.normal"></button>
            <button type="button" data-width-choice="wide" data-i18n="settings.wide"></button>
          </div>
          <p class="menu-label" data-i18n="settings.longNotes"></p>
          <div class="theme-switch" role="group" data-i18n-aria="settings.longNotes">
            <button type="button" data-fold-choice="fold" data-i18n="settings.fold"></button>
            <button type="button" data-fold-choice="full" data-i18n="settings.full"></button>
          </div>
          <p class="menu-label" data-i18n="settings.language"></p>
          <select class="lang-select" data-i18n-aria="settings.language"></select>
          <hr>
          <a class="credit" href="https://sidebit.io" target="_blank" rel="noopener" data-i18n="credit"></a>
        </div>
      </div>
    </div>
    <div class="usage" id="usage" aria-hidden="true" hidden><span></span></div>
  </header>

  <div class="wrap invite-bar-wrap" id="invite-bar" hidden>
    <div class="invite-bar" role="region" data-i18n-aria="bar.label">
      <p data-i18n="bar.ready"></p>
      <code id="bar-link"></code>
      <button type="button" class="bar-copy" id="bar-copy" data-i18n="bar.copy"></button>
      <button type="button" class="bar-more" id="bar-more" data-i18n="bar.more"></button>
      <button type="button" class="notice-close" id="bar-close" data-i18n-aria="bar.close" data-i18n-title="bar.close">&times;</button>
    </div>
  </div>
  <section class="pinned wrap" id="pinned" aria-labelledby="pinned-title" hidden>
    <div class="pinned-head">
      <h2 class="pinned-title" id="pinned-title"></h2>
      <button type="button" class="pinned-toggle" aria-expanded="true"></button>
    </div>
    <div class="pinned-body"></div>
  </section>
  <main class="feed wrap" id="feed"></main>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>
  <div class="empty wrap" id="empty" hidden>
    <p id="room-empty"><strong data-i18n="room.empty"></strong> <span data-i18n="room.emptyHint"></span></p>
    <div class="draft-empty" id="draft-empty" hidden>
      <p class="draft-lede" data-i18n="draft.lede"></p>
      <p><button type="button" class="link" id="draft-join" data-i18n="draft.join"></button></p>
      <p class="error" id="draft-err" role="alert" hidden></p>
      <p class="hint" data-i18n="draft.privacy"></p>
    </div>
  </div>

  <footer class="composer">
    <form class="wrap" id="compose-form" autocomplete="off">
      <div class="reply-bar" id="reply-bar" hidden>
        <span id="reply-text"></span>
        <button type="button" id="reply-cancel" data-i18n-aria="reply.cancel" data-i18n-title="reply.cancel">&times;</button>
      </div>
      <div class="attach" id="attach" hidden></div>
      <textarea id="compose-text" rows="3" spellcheck="false" autocapitalize="off" autocorrect="off" data-i18n-placeholder="compose.placeholder" data-i18n-aria="compose.label"></textarea>
      <div class="compose-row">
        <select id="compose-lang" data-i18n-aria="compose.lang" data-i18n-title="compose.lang"></select>
        <label class="as" for="compose-name" data-i18n="compose.as"></label>
        <input id="compose-name" class="name-in" type="text" maxlength="40" data-i18n-placeholder="compose.name">
        <label class="burn-opt" for="compose-burn"><input type="checkbox" id="compose-burn"> <span data-i18n="compose.burn"></span></label>
        <span class="hint" id="compose-size"></span>
        <div class="spacer"></div>
        <button class="primary" type="submit" id="compose-send" data-i18n="compose.send"></button>
      </div>
    </form>
  </footer>
</div>

<div class="confirm" id="confirm" hidden>
  <div class="confirm-box card" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
    <p id="confirm-text"></p>
    <div class="row end">
      <button type="button" class="ghost" id="confirm-no" data-i18n="confirm.cancel"></button>
      <button type="button" class="danger" id="confirm-yes"></button>
    </div>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" data-i18n-aria="image.viewer" hidden>
  <div class="viewer-scroll" id="viewer-scroll">
    <img id="viewer-img" alt="">
  </div>
  <div class="viewer-bar">
    <button type="button" class="viewer-btn" id="viewer-actual" aria-pressed="false" data-i18n="image.actual" hidden></button>
    <button type="button" class="viewer-btn close" id="viewer-close" data-i18n-aria="image.close" data-i18n-title="image.close">&times;</button>
  </div>
</div>

<div class="drop-hint" id="drop-hint" hidden><p data-i18n="image.dropHere"></p></div>

<div class="toasts">
  <div class="notice" id="notice" role="status" hidden>
    <p data-i18n="rolled.notice"></p>
    <button type="button" class="notice-new" id="notice-new" data-i18n="rolled.newSession"></button>
    <button type="button" class="notice-close" id="notice-close" data-i18n-aria="image.close" data-i18n-title="image.close">&times;</button>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
</body>
</html>
