# PastePage behind nginx, under a path of an existing HTTPS site: https://example.com/pastepage/
# Each line is explained in docs/deployment.md.

# Part 1 belongs at the http level, outside every server { } block. On Debian and Ubuntu the
# files in /etc/nginx/sites-enabled/ are already included inside http { }, so the top of your
# site's file works. If your configuration already defines $connection_upgrade, skip this part.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Part 2 goes inside the server { } block that already serves example.com over HTTPS.
server {
    # ... your existing listen, server_name and ssl_certificate lines ...

    # Send /pastepage to /pastepage/ so the page's relative links work.
    location = /pastepage {
        return 308 /pastepage/;
    }

    location /pastepage/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        client_max_body_size 2m;
    }
}
