# PastePage behind Apache httpd, under a path of an existing HTTPS site: https://example.com/pastepage/
# Each line is explained in docs/deployment.md.
#
# Needs Apache 2.4.47 or newer (for upgrade=websocket) and the modules proxy, proxy_http,
# headers and alias. On Debian and Ubuntu:
#   sudo a2enmod proxy proxy_http headers alias
#   sudo systemctl restart apache2
#
# Put these lines inside the <VirtualHost *:443> block that already serves example.com.

RedirectMatch 308 ^/pastepage$ /pastepage/
ProxyPass        /pastepage/ http://127.0.0.1:3000/ upgrade=websocket
ProxyPassReverse /pastepage/ http://127.0.0.1:3000/
RequestHeader set X-Forwarded-Proto "https"

# Apache older than 2.4.47 has no upgrade=websocket. There, mod_proxy_wstunnel handles the
# live connection: enable it (sudo a2enmod proxy_wstunnel) and replace the ProxyPass line
# above with these two, in this order. This variant is untested; see docs/deployment.md.
# ProxyPass /pastepage/ws ws://127.0.0.1:3000/ws
# ProxyPass /pastepage/   http://127.0.0.1:3000/
